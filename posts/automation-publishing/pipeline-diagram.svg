<svg width="100%" viewBox="0 0 680 738" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Как устроена автопубликация статей</title>
<desc>Схема: Obsidian сохраняет статью в репозиторий Forgejo, это будит второй репозиторий сайта, раннер на LXC собирает сайт и заливает его на хостинг</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
</style>

<rect x="180" y="40" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Obsidian</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central" fill="#444441">Пишете и сохраняете статью</text>
<line x1="340" y1="96" x2="340" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="118" width="380" height="232" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="170" y="136" text-anchor="start" fill="#444441">Forgejo — сервер с git-репозиториями</text>

<rect x="180" y="158" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="176" text-anchor="middle" dominant-baseline="central" fill="#04342C">Репозиторий со статьями</text>
<text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central" fill="#085041">Сюда попадает написанное</text>
<line x1="340" y1="214" x2="340" y2="274" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="274" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="292" text-anchor="middle" dominant-baseline="central" fill="#04342C">Репозиторий сайта</text>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central" fill="#085041">Получает сигнал собрать сайт</text>

<line x1="340" y1="350" x2="340" y2="410" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="410" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="428" text-anchor="middle" dominant-baseline="central" fill="#04342C">Раннер на LXC</text>
<text class="ts" x="340" y="446" text-anchor="middle" dominant-baseline="central" fill="#085041">Собирает сайт из статей</text>
<line x1="340" y1="466" x2="340" y2="526" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="526" width="320" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="544" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Хостинг</text>
<text class="ts" x="340" y="562" text-anchor="middle" dominant-baseline="central" fill="#712B13">Показывает готовый сайт</text>
</svg>

# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish" # UNCOMMENT THIS LINE
baseURL = "https://prohomelab.com/"
defaultContentLanguage = "ru"

pluralizeListTitles = true # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 100

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-VRHQGK81S9"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.8

[permalinks]
  posts = "/posts/:slug/"

[related]
  threshold = 0
  toLower = false
  includeNewer = true

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
        applyFilter = false
        name = 'fragmentrefs'
        type = 'fragments'
        weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[frontmatter]
  publishDate = ['publishdate', 'pubdate', 'date']

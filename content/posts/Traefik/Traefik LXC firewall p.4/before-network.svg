<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .seg { fill: none; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
    .segLabel { fill: #64748b; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    .svc { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
    .svcLabel { fill: #334155; font-size: 12px; }
    .traefik { fill: #fde68a; stroke: #d97706; stroke-width: 1.5; rx: 8; }
    .traefikLabel { fill: #7c2d12; font-size: 12px; font-weight: 700; }
    .conn { stroke: #cbd5e1; stroke-width: 1.2; }
    .title { fill: #0f172a; font-size: 16px; font-weight: 700; }
  </style>

  <text x="20" y="28" class="title">До: четыре сегмента, Traefik растворён в Homelab</text>

  <!-- LAN -->
  <rect x="20" y="60" width="140" height="70" class="seg"/>
  <text x="32" y="82" class="segLabel">LAN</text>
  <text x="32" y="100" class="svcLabel">доверенные</text>
  <text x="32" y="115" class="svcLabel">устройства</text>

  <!-- WiFi -->
  <rect x="20" y="150" width="140" height="70" class="seg"/>
  <text x="32" y="172" class="segLabel">WiFi (opt1)</text>
  <text x="32" y="190" class="svcLabel">TV, консоли,</text>
  <text x="32" y="205" class="svcLabel">мобильные</text>

  <!-- YouTube -->
  <rect x="20" y="240" width="140" height="70" class="seg"/>
  <text x="32" y="262" class="segLabel">YouTube (opt3)</text>
  <text x="32" y="280" class="svcLabel">съёмочное</text>
  <text x="32" y="295" class="svcLabel">оборудование</text>

  <!-- Homelab big box -->
  <rect x="220" y="55" width="600" height="330" class="seg" stroke="#475569" stroke-width="2"/>
  <text x="240" y="82" class="segLabel" font-size="14">Homelab (opt2) — один Docker-хост, одна docker-сеть</text>

  <!-- services inside -->
  <rect x="250" y="110" width="120" height="46" class="svc"/><text x="264" y="138" class="svcLabel">Sonarr</text>
  <rect x="390" y="110" width="120" height="46" class="svc"/><text x="404" y="138" class="svcLabel">Radarr</text>
  <rect x="530" y="110" width="120" height="46" class="svc"/><text x="544" y="138" class="svcLabel">Vaultwarden</text>
  <rect x="670" y="110" width="120" height="46" class="svc"/><text x="684" y="138" class="svcLabel">Authentik</text>

  <rect x="250" y="180" width="120" height="46" class="svc"/><text x="264" y="208" class="svcLabel">Komodo</text>
  <rect x="390" y="180" width="120" height="46" class="svc"/><text x="404" y="208" class="svcLabel">Forgejo</text>
  <rect x="530" y="180" width="120" height="46" class="svc"/><text x="544" y="208" class="svcLabel">Prowlarr</text>
  <rect x="670" y="180" width="120" height="46" class="svc"/><text x="684" y="208" class="svcLabel">… ещё ~15</text>

  <!-- Traefik highlighted, same network -->
  <rect x="250" y="250" width="180" height="60" class="traefik"/>
  <text x="266" y="276" class="traefikLabel">Traefik</text>
  <text x="266" y="294" class="svcLabel">общая сеть «proxy»,</text>
  <text x="266" y="307" class="svcLabel">равные права с соседями</text>

  <!-- fine mesh lines to show flat network -->
  <g class="conn">
    <line x1="310" y1="156" x2="310" y2="180"/>
    <line x1="450" y1="156" x2="450" y2="180"/>
    <line x1="590" y1="156" x2="590" y2="180"/>
    <line x1="310" y1="226" x2="340" y2="250"/>
    <line x1="450" y1="226" x2="400" y2="250"/>
    <line x1="590" y1="226" x2="430" y2="250"/>
    <line x1="730" y1="226" x2="430" y2="270"/>
  </g>

  <!-- limited access from other segments to Homelab, but not to specific ports -->
  <g class="conn" stroke-dasharray="4 3">
    <line x1="160" y1="95" x2="220" y2="140"/>
    <line x1="160" y1="185" x2="220" y2="200"/>
    <line x1="160" y1="275" x2="220" y2="260"/>
  </g>
  <text x="165" y="130" class="svcLabel" font-size="11" fill="#94a3b8">точечные разрешения</text>
  <text x="165" y="143" class="svcLabel" font-size="11" fill="#94a3b8">(Plex, Postgres…)</text>

  <text x="250" y="405" class="svcLabel" font-size="12" fill="#7c2d12">Traefik виден и достижим точно так же, как любой другой контейнер рядом — отдельного периметра под него нет.</text>
</svg>
